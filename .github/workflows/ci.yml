name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Browser installation and the full E2E suite can exceed 20 minutes.
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build production app
        run: npm run build

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Run Batch B acceptance against the production bundle
        run: npm run test:e2e:batch-b

      - name: Run Batch C acceptance against the production bundle
        run: npm run test:e2e:batch-c

      - name: Save Batch C browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: batch-c-browser-evidence
          path: |
            test-results/batch-c-results.json
            test-results/batch-c/
            playwright-report/batch-c/
          if-no-files-found: warn
          retention-days: 14

      - name: Save Batch B browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: batch-b-browser-evidence
          path: |
            test-results/batch-b-results.json
            test-results/batch-b/
            playwright-report/batch-b/
          if-no-files-found: warn
          retention-days: 14

      - name: Save Pages build from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
