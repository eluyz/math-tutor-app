name: CI

on:
  pull_request:
    branches: [main, qa/batch-c-controlled-acceptance]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Browser installation and the full E2E suite can exceed 20 minutes.
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build production app
        run: npm run build

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Run Batch B acceptance against the production bundle
        run: npm run test:e2e:batch-b

      - name: Run Batch C acceptance against the production bundle
        run: npm run test:e2e:batch-c

      - name: Run Batch D acceptance against the production bundle
        run: npm run test:e2e:batch-d

      - name: Save Batch D browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: batch-d-browser-evidence
          path: |
            test-results/batch-d-results.json
            test-results/batch-d/
            playwright-report/batch-d/
          if-no-files-found: warn
          retention-days: 14

      - name: Run Batch E acceptance against the production bundle
        run: npm run test:e2e:batch-e

      - name: Save Batch E browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: batch-e-browser-evidence
          path: |
            test-results/batch-e-results.json
            test-results/batch-e/
            playwright-report/batch-e/
          if-no-files-found: warn
          retention-days: 14

      - name: Run Batch F acceptance against the production bundle
        run: npm run test:e2e:batch-f

      - name: Save Batch F browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: batch-f-browser-evidence
          path: |
            test-results/batch-f-results.json
            test-results/batch-f/
            playwright-report/batch-f/
          if-no-files-found: warn
          retention-days: 14

      - name: Run Batch G acceptance against the production bundle
        run: npm run test:e2e:batch-g

      - name: Save Batch G browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: batch-g-browser-evidence
          path: |
            test-results/batch-g-results.json
            test-results/batch-g/
            playwright-report/batch-g/
          if-no-files-found: warn
          retention-days: 14

      - name: Save Batch C browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: batch-c-browser-evidence
          path: |
            test-results/batch-c-results.json
            test-results/batch-c/
            playwright-report/batch-c/
          if-no-files-found: warn
          retention-days: 14

      - name: Save Batch B browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: batch-b-browser-evidence
          path: |
            test-results/batch-b-results.json
            test-results/batch-b/
            playwright-report/batch-b/
          if-no-files-found: warn
          retention-days: 14

      - name: Save Pages build from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
